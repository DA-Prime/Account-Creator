<!DOCTYPE html>
<html>
    <!--
        Author: Daniel Avalos
        Date: 05/06/2025
        File Name: result.html
    -->
    <head>
        <title>D-Nerd Account Created</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/styles.css">
        <script>
            window.addEventListener("load", function() {
                var formData = location.search.slice(1);
                formData = formData.replace(/\+/g," ");
                formData = decodeURIComponent(formData);
                let formFields = formData.split(/[&=]/g);

                document.getElementById("userResult").textContent = formFields[1];
                document.getElementById("emailResult").textContent = formFields[3];
                document.getElementById("passResult").textContent = formFields[5];
            })
        </script>
    </head>
    <body>
        <header>
            <img alt="The img of the logo" src="images/D-Nerd Logo.png">
            <h1>Your D-Nerd Account is created</h1>
        </header>
        <main>
            <table>
                <tr>
                    <th>Title</th>
                    <th>Result</th>
                </tr>
                <tr>
                    <td>Username:</td>
                    <td id="userResult"></td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td id="emailResult"></td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td id="passResult"></td>
                </tr>
            </table>
        </main>
        <footer>
            <p>Copyright D-Nerd.com</p>
        </footer>
    </body>
</html>
