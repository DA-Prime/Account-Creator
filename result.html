<!DOCTYPE html>

    <head>
        <title>D-Nerd Account Created</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/styles.css">
        <script>
            window.addEventListener("load", function() {
                var formData = location.search.slice(1);
                formData = formData.replace(/\+/g," ");
                formData = decodeURIComponent(formData);
                let formFields = formData.split(/[&=]/g);

                document.getElementById("userResult").textContent = formFields[1];
                document.getElementById("emailResult").textContent = formFields[3];
                document.getElementById("passResult").textContent = formFields[5];
            })
        </script>
    </head>
    <body>
        <header>
            <h1>DAN.AVA.DEV</h1>
        </header>
        <main>
            <h1>Your DAN.AVA.DEV Account has been created!</h1>
            <table>
                <tr>
                    <th>Title</th>
                    <th>Result</th>
                </tr>
                <tr>
                    <td>Username:</td>
                    <td id="userResult"></td>
                </tr>
                <tr>
                    <td>Email:</td>
                    <td id="emailResult"></td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td id="passResult"></td>
                </tr>
            </table>
        </main>
        <footer>

                <a href="https://github.com/DA-Prime"><img alt="GitHub logo" src="images/GitHub-logo.png"></a>
            </p>
        </footer>
    </body>
</html>
