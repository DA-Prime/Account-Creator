<!DOCTYPE html>
<html>
    <!--
        Author: Daniel Avalos
        Date: 05/06/2025
        File Name: index.html
    -->
    <head>
        <title>The Account Generator</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/styles.css">
        <script src="js/script.js" defer></script>
    </head>
    <body>
        <header>
            <img alt="The img of the logo" src="images/D-Nerd Logo.png">
            <h1>The Account Generator by D-Nerd</h1>
        </header>
        <main>
            <form id="signUp" name="signUp" method="get" action="result.html">
                <fieldset>
                    <legend>Create your account</legend>

                    <label for="user">Username:</label>
                    <input type="text" id="user" name="user" required>
                    <br>
                    <br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                    <br>
                    <br>
                    <label for="pwd">Password</label>
                    <input type="password" id="pwd" name="pwd" required>
                    <br>
                    <p id="feedBack"></p>

                    <input type="submit" id="submitBtn" value="Save">
                </fieldset>
            </form>
        </main>
        <footer>
            <p>Copyright D-Nerd.com</p>
        </footer>
    </body>
</html>
